spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: department-route
              uri: lb://department-service
              predicates: [ "Path=/campus/api/departments/**" ]
              filters: [ "StripPrefix=1", "AddResponseHeader=X-Gateway, gateway-service" ]
            - id: teacher-route
              uri: lb://teacher-service
              predicates: [ "Path=/campus/api/teachers/**" ]
              filters:
                - StripPrefix=1
                - AddResponseHeader=X-Gateway, gateway-service
                # TP7 §4 : circuit breaker + fallback sur la route Teacher
                - name: CircuitBreaker
                  args:
                    name: teacherCircuitBreaker
                    fallbackUri: forward:/fallback/teachers
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

# TP7 §4 : Resilience4j côté Gateway
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      teacherCircuitBreaker:
        timeoutDuration: 2s
